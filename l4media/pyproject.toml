[project]
name = "l4media-archive"
version = "0.1.0"
description = "Deterministic archive pipeline and retention tools for l4media technical samples and quality events"
requires-python = "==3.14.*"
dependencies = [
    "jsonschema>=4.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.12.0",
    "pyright[nodejs]>=1.1.400",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["archive"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "UP",
    "I",
]
ignore = [
    "E501",
]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
