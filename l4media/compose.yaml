name: l4media

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: l4media-nginx
    restart: unless-stopped
    ports:
      - "${L4MEDIA_PORT:-8443}:8443"
    volumes:
      - ${CA_CERT_PATH:-/home/user1/iot-rpc-rest-app/crt/iot_leo4_ca.crt}:/crt/ca_certificate.pem:ro
      - ./crt/server_certificate.pem:/crt/server_certificate.pem:ro
      - ./crt/server_key.pem:/crt/server_key.pem:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - l4media_net
    depends_on:
      - ingress

  ingress:
    build:
      context: ./ingress
      dockerfile: Dockerfile
    container_name: l4media-ingress
    restart: unless-stopped
    environment:
      - JANUS_HOST=janus
      - JANUS_ADMIN_PORT=${JANUS_ADMIN_PORT:-7088}
      - JANUS_ADMIN_SECRET=${JANUS_ADMIN_SECRET:-janusoverlord}
      - L4MEDIA_SERVICE_TOKEN=${L4MEDIA_SERVICE_TOKEN:-l4media-service-secret-token}
      - ROUTES_FILE=/etc/l4media/routes.conf
      - REDIS_URL=${L4MEDIA_REDIS_URL:-redis://redis:6379/2}
    volumes:
      - ./ingress/routes.conf:/etc/l4media/routes.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - l4media_net
      - user1_default
    depends_on:
      - janus

  janus:
    image: canyan/janus-gateway:latest
    container_name: l4media-janus
    restart: unless-stopped
    volumes:
      - ./janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
      - ./janus/janus.plugin.streaming.jcfg:/usr/local/etc/janus/janus.plugin.streaming.jcfg:ro
      - ./janus/janus.transport.http.jcfg:/usr/local/etc/janus/janus.transport.http.jcfg:ro
    ports:
      # WebRTC media UDP port range for future browser streaming
      - "20000-20100:20000-20100/udp"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - l4media_net
      - user1_default

  archive-worker:
    image: python:3.14-slim
    container_name: l4media-archive-worker
    restart: unless-stopped
    working_dir: /app
    environment:
      - L4MEDIA_ARCHIVE_WORKER_ENABLED=${L4MEDIA_ARCHIVE_WORKER_ENABLED:-false}
      - L4MEDIA_ARCHIVE_DRY_RUN=${L4MEDIA_ARCHIVE_DRY_RUN:-false}
      - L4MEDIA_ARCHIVE_VOLUME_ROOT=${L4MEDIA_ARCHIVE_VOLUME_ROOT:-/mnt/l4desk-archive}
      - L4MEDIA_HOT_TELEMETRY_DIR=${L4MEDIA_HOT_TELEMETRY_DIR:-/var/lib/l4media/telemetry}
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app:ro
      - ${L4MEDIA_ARCHIVE_VOLUME_ROOT:-/mnt/l4desk-archive}:${L4MEDIA_ARCHIVE_VOLUME_ROOT:-/mnt/l4desk-archive}
      - ${L4MEDIA_HOT_TELEMETRY_DIR:-/var/lib/l4media/telemetry}:${L4MEDIA_HOT_TELEMETRY_DIR:-/var/lib/l4media/telemetry}
    command: ["python3", "-m", "archive.worker"]
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - l4media_net
    profiles:
      - archive

networks:
  l4media_net:
    name: l4media_net
    driver: bridge
    attachable: true
  user1_default:
    external: true
