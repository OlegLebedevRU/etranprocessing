[project]
name = "processing-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0.0",
    "lxml>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
