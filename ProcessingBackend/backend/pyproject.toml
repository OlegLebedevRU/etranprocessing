[project]
name = "processing-backend"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0.0",
    "lxml>=5.0.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "python-dateutil>=2.9.0",
    "pyjwt>=2.10.0",
    "alembic>=1.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=9.1.1",
    "anyio>=4.9.0",
    "trio>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = [
    "UP",
    "I",
]
ignore = [
    "B008",  # FastAPI Depends() in default args is idiomatic
]
