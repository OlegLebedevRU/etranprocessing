upstream new_processing_backend {
    server processing-backend:8000;
    keepalive 32;
}

server {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name iot-processing.ru;
    access_log /var/log/nginx/ssl-mutual-access.log;
    error_log /var/log/nginx/ssl-mutual-error.log;

    ssl_certificate /crt/iot-processing.ru.crt;
    ssl_certificate_key /crt/iot-processing.ru.key;

    # CA для проверки клиентских сертификатов при усилении защиты
    # ssl_client_certificate /crt/iot_leo4_ca.crt;
    ssl_verify_client optional_no_ca;

    location = /ssl-debug {
        return 200 "
        Client Cert: $ssl_client_escaped_cert
        ";
        add_header Content-Type text/plain;
    }

    # === ListMenuFile (ProcessingBackend owner) ===
    location = /api/ListMenuFile {
        proxy_pass http://new_processing_backend/api/ListMenuFile$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Issuer-DN $ssl_client_i_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_buffering off;
    }

    # === Certificates ===
    location = /certificates/ {
        proxy_pass http://new_processing_backend/api/certificates/$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /certificates/Dispatcher.ashx {
        proxy_pass http://new_processing_backend/api/certificates/$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /certificates {
        proxy_pass http://new_processing_backend/api/certificates/$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ~ ^/api/certificates(/.*)?$ {
        proxy_pass http://new_processing_backend/api/certificates$1$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # === Payment (Primary: new_processing_backend, Mirror: legacy) ===
    location = /payment/ {
        mirror /_mirror_payment;
        mirror_request_body on;

        proxy_pass http://new_processing_backend/api/payment/$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
