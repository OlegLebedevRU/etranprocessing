server {
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    ssl_prefer_server_ciphers on;
    listen 4443 ssl;
    listen [::]:4443 ssl;
    server_name dev.leo4.ru;
    resolver 127.0.0.11 valid=10s;
    set $backend2 http://app1:8000;
    access_log /var/log/nginx/ssl-mutual-access.log;
    error_log /var/log/nginx/ssl-mutual-error.log debug;

    ssl_certificate /crt/legacy_cert_dev_leo4_ru.crt;
    ssl_certificate_key /crt/server_key.pem;

    ssl_verify_client optional_no_ca;

    # === Fix double /api/api/ prefix (terminal bug) ===
    location ~ ^/api/api/(.*)$ {
        return 301 /api/$1$is_args$args;
    }

    # === API MenuBuilder (ListMenuFile) ===
    location /api/ListMenuFile {
        proxy_pass http://menubuilder-backend:8000/api/ListMenuFile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_buffering off;
    }

    # === API Debug (processing-backend) ===
    location /api/debug/ {
        proxy_pass http://processing-backend:8000/api/debug/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Legacy licensebilling ===
    location = /api/licensebilling/ {
        proxy_pass http://processing-backend:8000/api/licensebilling/check$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Legacy GateGauge ===
    location = /api/GateGauge/main.ashx {
        proxy_pass http://processing-backend:8000/api/gategauge$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Payment: /api/payment/ ===
    location /api/payment/ {
        proxy_pass http://processing-backend:8000/api/payment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Legacy TechGate ===
    location ~ ^/api/techgate/etran\.ashx$ {
        proxy_pass http://processing-backend:8000/api/techgate$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    # === Generic processing backend ===
    location ~ ^/api/(licensebilling|gategauge|techgate)(/.*)?$ {
        proxy_pass http://processing-backend:8000/api/$1$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
        proxy_buffering off;
    }

    location /ssl-mutual-test/ {
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass $backend2/api/v1/devices/map_legacy_crt/;
        proxy_redirect off;
    }

    location = /ssl-debug {
        return 200 "
        Client Cert: $ssl_client_escaped_cert
        ";
        add_header Content-Type text/plain;
    }

    # === Default: proxy to legacy iot-processing.ru ===
    location / {
        proxy_pass http://iot-processing.ru;
        proxy_redirect off;

        proxy_set_header X-Client-Cert-Serial   $ssl_client_serial;
        proxy_set_header X-Client-Cert-DN       $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-SSL-Client-Cert      $ssl_client_escaped_cert;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
