services:
  processing-backend:
    build:
      context: ..
      dockerfile: ProcessingBackend/backend/Dockerfile
    container_name: processing-backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./log:/app/log
      - ./keys:/function/storage/keys:ro
    networks:
      - pg_network

  mcp-pin-server:
    build: ./mcp-pin-server
    container_name: mcp-pin-server
    restart: unless-stopped
    env_file:
      - ./mcp-pin-server/.env
    networks:
      - pg_network
    depends_on:
      - processing-backend

networks:
  pg_network:
    external: true
    name: iot-rpc-rest-app_pg_network
