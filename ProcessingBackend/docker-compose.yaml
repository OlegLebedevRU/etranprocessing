services:
  processing-backend:
    build:
      context: ..
      dockerfile: ProcessingBackend/backend/Dockerfile
    container_name: processing-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      CA_SIGNER_BACKEND: local
      CA_ISSUING_KEY_PATH: /run/secrets/terminal-ca/issuer.key.pem
      CA_ISSUING_KEY_PASSWORD_FILE: /run/secrets/terminal-ca/issuer-password.env
      CA_ISSUING_CERT_PATH: ""
    volumes:
      - ./log:/app/log
      - ./keys:/function/storage/keys:ro
      - ./issuer-secrets:/run/secrets/terminal-ca:ro
    networks:
      - pg_network

networks:
  pg_network:
    external: true
    name: iot-rpc-rest-app_pg_network
