# One ordered build plan. Component build.cmd owns its local native tests.
schema = 1
registry = "https://l4tools-generic.ar.cloud.ru"
timestamp_url = "http://timestamp.digicert.com"
dist = "tools/dist"
source_paths = ["l4release", "pyproject.toml", "uv.lock", "tools", "ffmpeg-win32", "deploy/publish_l4tools.py"]
generated_inputs = ["tools/version.txt", "tools/l4setup/src/version.h", "tools/l4setup/res/version.h", "tools/l4setup/res/network-profile.bin"]
required_assets = ["tools/mosquitto/mosquitto.exe", "ffmpeg-win32/x86/ffmpeg.exe", "ffmpeg-win32/x64/ffmpeg.exe", "tools/l4capture/vendor/openh264/codec/api/wels/codec_api.h", "tools/l4capture/vendor/openh264/builddir_x86/codec/encoder/libencoder.a", "tools/l4capture/vendor/openh264/builddir_x86/codec/common/libcommon.a", "tools/l4capture/vendor/openh264/builddir_x86/codec/processing/libprocessing.a", "tools/l4capture/vendor/openh264/builddir_x64/codec/encoder/libencoder.a", "tools/l4capture/vendor/openh264/builddir_x64/codec/common/libcommon.a", "tools/l4capture/vendor/openh264/builddir_x64/codec/processing/libprocessing.a"]

[[steps]]
name = "version"
kind = "powershell"
cwd = "."
args = ["tools/release/Prepare-BuildVersion.ps1", "-Version", "{version}"]
timeout = 60

[[steps]]
name = "l4pin"
kind = "cmd"
cwd = "tools/l4pin"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4pin/bin/x86/l4pin.exe", "tools/l4pin/bin/x64/l4pin.exe", "tools/l4pin/bin/l4pin.exe"]

[[steps]]
name = "l4superv"
kind = "cmd"
cwd = "tools/l4superv"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4superv/bin/x86/l4superv.exe", "tools/l4superv/bin/x64/l4superv.exe", "tools/l4superv/bin/l4superv.exe"]

[[steps]]
name = "l4desk"
kind = "cmd"
cwd = "tools/l4desk"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4desk/bin/x86/l4desk.exe", "tools/l4desk/bin/x64/l4desk.exe", "tools/l4desk/bin/l4desk.exe"]

[[steps]]
name = "l4con"
kind = "cmd"
cwd = "tools/l4con"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4con/bin/x86/l4con.exe", "tools/l4con/bin/x64/l4con.exe", "tools/l4con/bin/l4con.exe"]

[[steps]]
name = "l4sql"
kind = "cmd"
cwd = "tools/l4sql"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4sql/bin/x86/l4sql.exe", "tools/l4sql/bin/x64/l4sql.exe", "tools/l4sql/bin/l4sql.exe"]

[[steps]]
name = "l4capture"
kind = "cmd"
cwd = "tools/l4capture"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4capture/bin/x86/l4capture.exe", "tools/l4capture/bin/x64/l4capture.exe", "tools/l4capture/bin/l4capture.exe"]

[[steps]]
name = "l4capture-tests-x86"
kind = "cmd"
cwd = "tools/l4capture"
args = ["test.cmd"]
timeout = 300

[[steps]]
name = "leo4proxy"
kind = "cmd"
cwd = "tools/leo4proxy"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/leo4proxy/bin/x86/leo4proxy.exe", "tools/leo4proxy/bin/x64/leo4proxy.exe", "tools/leo4proxy/bin/leo4proxy.exe"]

[[steps]]
name = "l4launch"
kind = "cmd"
cwd = "tools/l4launch"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4launch/bin/x86/l4launch.exe", "tools/l4launch/bin/x64/l4launch.exe", "tools/l4launch/bin/l4launch.exe"]

[[steps]]
name = "stage"
kind = "powershell"
cwd = "."
args = ["tools/release/Build-StagingPayloads.ps1"]
timeout = 180

[[steps]]
name = "setup-test-x86"
kind = "cmd"
cwd = "tools/l4setup"
args = ["run_tests.cmd", "x86"]
timeout = 900

[[steps]]
name = "setup-test-x64"
kind = "cmd"
cwd = "tools/l4setup"
args = ["run_tests.cmd", "x64"]
timeout = 900

[[steps]]
name = "setup"
kind = "cmd"
cwd = "tools/l4setup"
args = ["build.cmd", "all"]
timeout = 300
outputs = ["tools/l4setup/bin/x86/l4setup.exe", "tools/l4setup/bin/x64/l4setup.exe", "tools/l4setup/bin/l4setup.exe"]
