name: HEVC frozen contract
on:
  # Disabled in GitHub as well; retain an explicit manual check for future use.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install jsonschema==4.26.0 pydantic==2.12.3
      - name: Check schemas, golden vectors and frozen revision
        run: python contracts/hevc-v2/verify.py --expected-digest f065b967cd10c2c709fb394ef9e6c2ecf74f77de060d88c9a821cc9069766ac4
