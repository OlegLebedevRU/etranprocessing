[project]
name = "l4mcp"
version = "0.2.0"
description = "L4mcp for MenuBuilder console, certificates, and reports"
requires-python = "==3.14.*"
dependencies = [
    "fastmcp>=4.0.0b3",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
l4mcp = "l4mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l4mcp"]

[tool.ruff.lint]
extend-select = [
    "UP",
    "I",
]
ignore = [
    "B008",  # FastAPI Depends() in default args is idiomatic
]
