server {
    listen 443 ssl;
    server_name dev.leo4.ru;

    error_page 497 =301 https://$http_host$request_uri;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    auth_jwt_enabled on;
    auth_jwt_algorithm RS256;
    auth_jwt_redirect off;
    auth_jwt_location COOKIE=accessToken;
    auth_jwt_key "-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAl65k5hGusEW36uqIKlP7
UOFCH/buUeVqCVGh8LjIif6KYWFbRTQcREk12zCRfmt4MxJ17gLEh9MKDA1UaqqX
lHzO58CFCYvVb4LKQZEYQrLA0GRWn/cH56cN8Ptdxt6JKyZQag9QarjhU0tz5Qjj
w4UREZE8u7hZEUi/LLagyeSqqutyg7BX5xMQuoNdlNB3+fC4Dp+xTRTbDmODGmJV
gtni2Xs3h50CkM4CGWo5ZQvn+V1QN7OXIRavflyNSQzr1SM/er4yt0B2NXZQuZon
wQrvPEpcW0A5/1kfgL7WPv4ZttFEJcZSFBSfz8G8lRFIKJRPCIU718qjj2J9wSTr
bQIDAQAB
-----END PUBLIC KEY-----";

    location /api/auth/ {
        auth_jwt_enabled off;
        proxy_pass http://menubuilder-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id "";
        proxy_set_header X-Org-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header jwt-sub "";
        proxy_set_header jwt-org "";
        proxy_set_header jwt-role "";
    }

    # L4mcp API tokens are validated by MenuBuilder on every request.
    location /api/mcp/ {
        proxy_pass http://menubuilder-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header X-Auth-Jti "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Billing API — handled by MenuBuilder backend
    location /api/billing/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass http://menubuilder-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $jwt_claim_userId;
        proxy_set_header X-Org-Id $jwt_claim_orgId;
        proxy_set_header X-User-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_roleId;
        proxy_set_header jwt-sub "";
        proxy_set_header jwt-org "";
        proxy_set_header jwt-role "";
    }

    # IoT Platform REST APIs (iot-rpc-rest-app Internal API)
    location ~ ^/api/internal/v1/(devices|device-tasks|device-events|accounts)/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass http://app1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Service-Key "${INTERNAL_SERVICE_KEY}";
        proxy_set_header orgId $jwt_claim_org;
        proxy_set_header X-Org-Id $jwt_claim_org;
        proxy_set_header jwt-org $jwt_claim_org;
        proxy_set_header X-User-Id $jwt_claim_sub;
        proxy_set_header jwt-sub $jwt_claim_sub;
        proxy_set_header X-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_role;
        proxy_set_header jwt-role $jwt_claim_role;
    }

    # IoT Platform Diagnostics & WebSocket Console (Internal API)
    location /api/internal/v1/diagnostics/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass http://app1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Service-Key "${INTERNAL_SERVICE_KEY}";
        proxy_set_header orgId $jwt_claim_org;
        proxy_set_header X-Org-Id $jwt_claim_org;
        proxy_set_header jwt-org $jwt_claim_org;
        proxy_set_header X-User-Id $jwt_claim_sub;
        proxy_set_header jwt-sub $jwt_claim_sub;
        proxy_set_header X-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_role;
        proxy_set_header jwt-role $jwt_claim_role;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/video/devices/[0-9]+/watch/ws$ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;
        proxy_pass http://menubuilder-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $jwt_claim_userId;
        proxy_set_header X-Org-Id $jwt_claim_orgId;
        proxy_set_header X-User-Role $jwt_claim_role;
        proxy_read_timeout 75s;
    }

    location /api/ {
        auth_jwt_location COOKIE=accessToken;
        auth_jwt_extract_var_claims sub org role userId orgId roleId;

        proxy_pass http://menubuilder-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $jwt_claim_userId;
        proxy_set_header X-Org-Id $jwt_claim_orgId;
        proxy_set_header X-User-Role $jwt_claim_role;
        proxy_set_header X-Role-Id $jwt_claim_roleId;
        proxy_set_header jwt-sub "";
        proxy_set_header jwt-org "";
        proxy_set_header jwt-role "";
    }

    location / {
        auth_jwt_enabled off;
        try_files $uri $uri/ /index.html;
    }
}
