server {
    listen 443 ssl;
    server_name dev.leo4.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    auth_jwt_enabled on;
    auth_jwt_key "${JWT_SECRET_HEX}";
    auth_jwt_algorithm HS256;
    auth_jwt_redirect off;
    auth_jwt_location HEADER=Authorization;

    location /api/auth/ {
        auth_jwt_enabled off;
        proxy_pass http://menubuilder-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ListMenuFile {
        auth_jwt_enabled off;
        proxy_pass http://menubuilder-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP — JWT terminated here, only jti forwarded to backend
    # Streamable HTTP: SSE streaming requires proxy_buffering off
    location /api/mcp/ {
        auth_jwt_extract_var_claims jti;

        proxy_pass http://menubuilder-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header X-Auth-Jti $jwt_claim_jti;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";  # Strip JWT — terminated at nginx
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        auth_jwt_extract_request_claims sub;

        proxy_pass http://menubuilder-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_jwt_enabled off;
        try_files $uri $uri/ /index.html;
    }
}
