services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "5672:5672"
    environment:
      RABBITMQ_HOST: "%"
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - ./iot-rpc-rest-app/rmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./iot-rpc-rest-app/rmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./iot-rpc-rest-app/rmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./iot-rpc-rest-app/crt/iot_leo4_ca.crt:/crt/ca_certificate.pem:ro
      - ./iot-rpc-rest-app/crt/cert_0000.pem:/crt/server_certificate.pem:ro
      - ./iot-rpc-rest-app/crt/key_0000.pem:/crt/server_key.pem:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ./MenuBuilder
      dockerfile: nginx/Dockerfile
    container_name: nginx-default
    restart: always
    ports:
      - "80:80"
      - "3000:3000"
      - "1443:1443"
      - "1444:1444"
    environment:
      - JWT_SECRET_HEX=${JWT_SECRET_HEX:?required}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?required}
    volumes:
      - ./MenuBuilder/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx-configs/port_80.conf:/etc/nginx/conf.d/port_80.conf:ro
      - ./nginx-configs/port_3000.conf:/etc/nginx/conf.d/port_3000.conf:ro
      - ./nginx-configs/terem_email_mtls.conf:/etc/nginx/conf.d/terem_email_mtls.conf:ro
      - ./nginx-configs/terem_email_proxy.inc:/etc/nginx/conf.d/terem_email_proxy.inc:ro
      - ./nginx-configs/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx-configs/snippets:/etc/nginx/conf.d/snippets:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./iot-rpc-rest-app/crt/iot_leo4_ca.crt:/crt/ca_certificate.pem:ro
      - ./iot-rpc-rest-app/crt/cert_0000.pem:/crt/server_certificate.pem:ro
      - ./iot-rpc-rest-app/crt/key_0000.pem:/crt/server_key.pem:ro

  processing-backend:
    environment:
      LEO4PROXY_ENDPOINTS: ${LEO4PROXY_ENDPOINTS:-}
      LEO4PROXY_ENDPOINTS_TTL_SECONDS: ${LEO4PROXY_ENDPOINTS_TTL_SECONDS:-86400}
    image: dev-leo4-ru.cr.cloud.ru/etran/processingbackend@sha256:09b29c2d57bf831bd3e699761974a77ae8581402c6345e933bedd4e4845fa646
    container_name: processing-backend
    restart: always
    env_file:
      - ./ProcessingBackend/backend/.env
    volumes:
      - ./ProcessingBackend/keys:/function/storage/keys:ro

  l4mcp:
    image: dev-leo4-ru.cr.cloud.ru/etran/l4mcp@sha256:7dcc28d19286d8ce99aedbdd4ccd2c4492ab0f7d7163416e9d9f947813069f4e
    container_name: l4mcp
    restart: unless-stopped
    env_file:
      - path: ./MenuBuilder/backend/.env
        format: raw
    environment:
      MENUBUILDER_API_URL: ${L4MCP_MENUBUILDER_API_URL:-}

  menubuilder-backend:
    image: dev-leo4-ru.cr.cloud.ru/etran/menubuilder-backend@sha256:1069e663926e496a780dfeb7cd68afe0dcd71bf187b96fe97e5af31afda483ae
    container_name: menubuilder-backend
    restart: always
    env_file:
      - path: ./MenuBuilder/backend/.env
        format: raw
    environment:
      L4MCP_URL: ${L4MCP_URL:-}

  app1:
    image: dev-leo4-ru.cr.cloud.ru/etran/app1@sha256:0b51e5b174ce37087cd4f6b1a89291ae72361e2b65c0fe9c73052fe700085d74
    container_name: app1
    restart: always
    env_file:
      - ./iot-rpc-rest-app/app-service/.env
    volumes:
      - ./iot-rpc-rest-app/logs:/var/log/app

  redis:
    image: redis:7.4-alpine
    container_name: iot-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./iot-rpc-rest-app/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  rabbitmq_data:
  redis_data:
