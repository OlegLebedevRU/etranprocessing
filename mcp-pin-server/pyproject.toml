[project]
name = "pin-server"
version = "0.1.0"
description = "MCP server for ProcessingBackend PIN code management and reports"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
pin-server = "pin_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pin_server"]
