[project]
name = "etranprocessing-db"
version = "0.1.1"
description = "Shared SQLAlchemy ORM models and DeclarativeBase for etranprocessing"
requires-python = "==3.14.*"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etranprocessing_db"]

[tool.hatch.build.targets.sdist]
include = [
    "/etranprocessing_db",
    "/pyproject.toml",
    "/docs/l4desk/schema-v1.json",
    "/docs/l4desk/schema-v1.md",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = [
    "UP",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
