[project]
name = "etranprocessing-gauge"
version = "0.1.0"
description = "Framework-independent deterministic gauge engine for etranprocessing"
requires-python = "==3.14.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etranprocessing_gauge"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "pyright[nodejs]>=1.1.400",
]

[tool.ruff.lint]
extend-select = ["UP", "I"]