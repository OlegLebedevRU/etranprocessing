[project]
name = "etranprocessing-access"
version = "0.1.0"
description = "Pure product entitlement decisions shared by MenuBuilder and ProcessingBackend"
requires-python = "==3.14.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etranprocessing_access"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.12.0", "pyright[nodejs]>=1.1.400"]

[tool.ruff.lint]
extend-select = ["UP", "I"]
